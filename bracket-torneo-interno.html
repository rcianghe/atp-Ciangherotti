<title>Torneo Interno — Bracket (demo)</title>
<style>
:root{--v:#5BBF2A;--vd:#3d8a1a;--vl:#7ed44a;--am:#D4E60A;--az:#2E7DD1;--ro:#C0392B;--ng:#0e0e0e;--gd:#1a1a1a;--g:#2a2a2a;--gm:#3a3a3a;--gl:#888;--bl:#f5f5f0}
*{box-sizing:border-box}
body{margin:0;font-family:'Barlow',Arial,sans-serif;background:var(--ng);color:var(--bl);padding:2rem 1rem}
.sh{text-align:center;margin-bottom:1.6rem}
.se{font-family:'Barlow Condensed',sans-serif;font-size:.62rem;font-weight:600;letter-spacing:4px;text-transform:uppercase;color:var(--v)}
.st{font-family:Georgia,serif;font-size:1.9rem;letter-spacing:1px}

/* ---- selector de torneo (serie / periodo) ---- */
.tint-tabs{display:flex;gap:.35rem;justify-content:center;margin-bottom:1.4rem;flex-wrap:wrap}
.tint-tb{font-family:'Barlow Condensed',sans-serif;font-size:.72rem;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;padding:.38rem 1.1rem;background:var(--g);color:var(--gl);border:1px solid var(--gm);border-radius:3px;cursor:pointer}
.tint-tb.active{background:var(--v);color:var(--ng);border-color:var(--v)}
.tint-estado{text-align:center;font-family:'Barlow Condensed',sans-serif;font-size:.72rem;letter-spacing:2px;text-transform:uppercase;color:var(--gl);margin-bottom:1.2rem}
.tint-estado b{color:var(--am)}

/* ---- indicador "en vivo" (Realtime conectado) ---- */
.tint-live{display:inline-flex;align-items:center;gap:.35rem;margin-left:.6rem;font-size:.6rem;letter-spacing:1.5px;color:var(--v);vertical-align:middle}
.tint-live-dot{width:7px;height:7px;border-radius:50%;background:var(--v);box-shadow:0 0 6px var(--v);animation:tintLivePulse 1.6s ease-in-out infinite}
@keyframes tintLivePulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.8)}}

/* ---- campeón destacado ---- */
.tint-campeon{max-width:420px;margin:0 auto 2rem;background:linear-gradient(135deg,rgba(212,230,10,.1),rgba(91,191,42,.08));border:1.5px solid rgba(212,230,10,.45);border-radius:14px;padding:1.1rem 1.3rem;text-align:center;box-shadow:0 0 24px rgba(212,230,10,.15)}
.tint-campeon .ic{font-size:1.8rem}
.tint-campeon .lbl{font-family:'Barlow Condensed',sans-serif;font-size:.62rem;letter-spacing:3px;text-transform:uppercase;color:var(--gl);margin-top:.3rem}
.tint-campeon .nom{font-family:Georgia,serif;font-size:1.5rem;color:var(--am);margin-top:.15rem}

/* ---- bracket ---- */
.tint-bracket-wrap{overflow-x:auto;padding-bottom:1rem}
.tint-bracket{display:flex;gap:2.6rem;min-width:max-content;padding:.5rem}
.tint-ronda{display:flex;flex-direction:column;justify-content:space-around;gap:1rem;min-width:190px}
.tint-rondatit{font-family:'Barlow Condensed',sans-serif;font-size:.62rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--v);text-align:center;margin-bottom:.3rem}
.tint-match{position:relative;background:var(--g);border:1px solid rgba(255,255,255,.08);border-radius:8px;overflow:hidden;transition:border-color .2s}
.tint-match:hover{border-color:rgba(91,191,42,.4)}
.tint-match.final{border-color:rgba(212,230,10,.5);box-shadow:0 0 14px rgba(212,230,10,.15)}
.tint-slot{display:flex;align-items:center;justify-content:space-between;padding:.5rem .6rem;font-size:.82rem;border-bottom:1px solid rgba(255,255,255,.05)}
.tint-slot:last-child{border-bottom:none}
.tint-slot.win{background:rgba(91,191,42,.1)}
.tint-slot .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tint-slot.win .nm{color:var(--v)}
.tint-slot.tbd .nm{color:var(--gl);font-style:italic;font-weight:400}
.tint-slot .sc{font-family:'Barlow Condensed',sans-serif;font-size:.72rem;color:var(--gl);flex-shrink:0;margin-left:.4rem}
.tint-bye{font-family:'Barlow Condensed',sans-serif;font-size:.62rem;letter-spacing:1px;text-transform:uppercase;color:var(--gl);text-align:center;padding:.35rem;font-style:italic}
.tint-mp{position:absolute;top:-8px;right:8px;background:var(--az);color:#fff;font-family:'Barlow Condensed',sans-serif;font-size:.55rem;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:.1rem .4rem;border-radius:8px}
/* Conectores entre rondas (líneas de bracket clásicas) */
.tint-ronda:not(:first-child) .tint-match::before{content:"";position:absolute;left:-1.3rem;top:50%;width:1.3rem;height:1px;background:var(--gm)}
.tint-ronda:not(:last-child){position:relative}

.tint-admin-cta{max-width:420px;margin:1.8rem auto 0;text-align:center;font-size:.78rem;color:var(--gl)}
@media(max-width:640px){.tint-bracket{gap:1.6rem}.tint-ronda{min-width:150px}}

/* ---- banner de error (club no resuelto / falla de Supabase) ---- */
.tint-err{max-width:520px;margin:0 auto 1.4rem;background:rgba(192,57,43,.12);border:1px solid rgba(192,57,43,.4);color:#ff8a7a;border-radius:8px;padding:.65rem .9rem;font-size:.8rem;text-align:center;display:none}
.tint-err.show{display:block}
</style>
</head>

<script>

window.supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");}

/* ============================================================
   MULTI-CLUB: de que club es este bracket
   ============================================================
   Este mismo archivo, con las mismas credenciales de Supabase, puede
   servir el bracket de MAS DE UN CLUB si "ChileTenis PRO" se ofrece a
   otros clubes ademas de Quilicura. El club se identifica por su
   "slug" en la URL:

     bracket-torneo-interno.html?club=quilicura
     bracket-torneo-interno.html?club=otro-club

   Si no viene "?club=" en la URL se usa DEFAULT_CLUB_SLUG, para que
   los enlaces ya compartidos (sin el parametro) sigan apuntando al
   club actual sin romperse.

   Requisito en Supabase (una sola vez, ver multi_club_migration.sql):
   columna club_id en "torneos_internos" y "jugadores", mas una fila
   en "clubes" con slug='quilicura'. Mientras esa migracion no se
   aplique, el codigo de abajo detecta el error de columna/tabla
   faltante y cae de vuelta al comportamiento anterior (sin filtro),
   para no romper el sitio en producción antes de correr el script.
   ============================================================ */
var DEFAULT_CLUB_SLUG='quilicura';
function obtenerClubSlugDeURL(){
  var params=new URLSearchParams(window.location.search);
  var slug=(params.get('club')||'').trim().toLowerCase();
  return slug||DEFAULT_CLUB_SLUG;
}
var CLUB_SLUG=obtenerClubSlugDeURL();
var CLUB_ACTUAL=null;       // {id,slug,nombre} una vez resuelto
var CLUB_FILTRO_DISPONIBLE=true; // false si la BD todavia no tiene club_id (migracion pendiente)

function mostrarErrorClub(msg){
  var el=document.getElementById('tintErr');
  if(!el)return;
  if(!msg){el.classList.remove('show');el.textContent='';return;}
  el.textContent=msg;
  el.classList.add('show');
}
function pintarNombreClub(nombre){
  var el=document.getElementById('tintClubNombre');
  if(el&&nombre)el.textContent=nombre;
}

// Codigos de error de PostgREST para "no existe la tabla" / "no existe la
// columna" (42P01 / 42703): asi distinguimos "todavia no corriste la
// migracion" de un fallo de red real, y en ese caso especifico
// degradamos con elegancia en vez de mostrar un error al socio.
function esErrorEsquemaFaltante(err){
  return !!err&&(err.code==='42P01'||err.code==='42703');
}

async function resolverClubActual(){
  try{
    // clubes.activo existe en el esquema real (confirmado en el CSV):
    // un club marcado como inactivo no debe mostrar su bracket publico.
    var res=await window.supabaseClient.from('clubes').select('id,slug,nombre,activo').eq('slug',CLUB_SLUG).maybeSingle();
    if(res.error){
      if(esErrorEsquemaFaltante(res.error)){
        console.warn('La tabla "clubes" (o su columna slug) todavia no existe. Corre multi_club_migration.sql en Supabase. Mostrando datos sin filtrar por club por ahora.',res.error);
        CLUB_FILTRO_DISPONIBLE=false;
        return null;
      }
      console.warn('No se pudo resolver el club actual.',res.error);
      return null;
    }
    if(!res.data){
      mostrarErrorClub('No se encontro el club "'+CLUB_SLUG+'". Revisa el link (?club=slug) o que exista esa fila en la tabla "clubes".');
      return null;
    }
    if(res.data.activo===false){
      mostrarErrorClub('El club "'+CLUB_SLUG+'" esta desactivado por ahora.');
      return null;
    }
    return res.data;
  }catch(err){
    console.warn('Sin conexion al resolver el club.',err);
    return null;
  }
}

/* ============================================================
   CARGA REAL DESDE SUPABASE (reemplaza MOCK_TORNEOS)
   ============================================================
   Arma exactamente la misma forma que MOCK_TORNEOS (mismas claves:
   id, serie, periodo, temporada, estado, campeon, rondas[][])
   para que rTorneoInterno()/rTintBracket() no necesiten cambiar nada.
   Se llama sola al cargar la pagina, mas abajo (en vez de rTorneoInterno()
   directo sobre el mock). */
async function cargarTorneosInternos(){
  try{
    // Paso 1: resolver el club (una sola vez por carga de pagina).
    if(CLUB_FILTRO_DISPONIBLE&&!CLUB_ACTUAL){
      CLUB_ACTUAL=await resolverClubActual();
      if(CLUB_ACTUAL){
        pintarNombreClub(CLUB_ACTUAL.nombre);
        mostrarErrorClub(null);
      }else if(CLUB_FILTRO_DISPONIBLE){
        // La tabla clubes existe pero no hay fila para este slug: no
        // seguimos, para no mostrarle a un club el bracket de otro.
        return;
      }
    }

    // Paso 2: torneos_internos, filtrados por club si es posible.
    var qTorneos=window.supabaseClient.from('torneos_internos').select('*').order('temporada',{ascending:false});
    if(CLUB_FILTRO_DISPONIBLE&&CLUB_ACTUAL)qTorneos=qTorneos.eq('club_id',CLUB_ACTUAL.id);
    var tRes=await qTorneos;
    if(tRes.error&&esErrorEsquemaFaltante(tRes.error)){
      // club_id todavia no existe en torneos_internos: reintenta sin filtro
      // (migracion pendiente) para no dejar el bracket vacio mientras tanto.
      console.warn('"torneos_internos" todavia no tiene club_id. Corre multi_club_migration.sql en Supabase.',tRes.error);
      CLUB_FILTRO_DISPONIBLE=false;
      tRes=await window.supabaseClient.from('torneos_internos').select('*').order('temporada',{ascending:false});
    }

    // Paso 3: partidos, solo de los torneos ya filtrados (evita traer el
    // cuadro completo de otros clubes por accidente).
    var idsTorneos=(tRes.data||[]).map(function(t){return t.id;});
    var pRes=idsTorneos.length
      ?await window.supabaseClient.from('torneo_partidos').select('*').in('torneo_id',idsTorneos)
      :{data:[],error:null};

    // Paso 4: jugadores, filtrados por club si es posible.
    var qJug=window.supabaseClient.from('jugadores').select('id,nombre');
    if(CLUB_FILTRO_DISPONIBLE&&CLUB_ACTUAL)qJug=qJug.eq('club_id',CLUB_ACTUAL.id);
    var jRes=await qJug;
    if(jRes.error&&esErrorEsquemaFaltante(jRes.error)){
      console.warn('"jugadores" todavia no tiene club_id. Corre multi_club_migration.sql en Supabase.',jRes.error);
      jRes=await window.supabaseClient.from('jugadores').select('id,nombre');
    }

    if(tRes.error||pRes.error||jRes.error){
      console.warn('No se pudo cargar el torneo interno desde Supabase, se muestran datos de ejemplo.',tRes.error,pRes.error,jRes.error);
      mostrarErrorClub('No se pudo actualizar el Torneo Interno en vivo. Mostrando el ultimo dato disponible.');
      return; // se queda con MOCK_TORNEOS
    }

    var idANombre={};
    jRes.data.forEach(function(j){idANombre[j.id]=j.nombre;});

    var torneosNuevos={};
    tRes.data.forEach(function(t){
      var key=t.serie+"-"+(t.periodo||"Unico")+"-"+t.temporada;
      var partidosDelTorneo=pRes.data.filter(function(p){return p.torneo_id===t.id;});
      var rondaMax=0;
      partidosDelTorneo.forEach(function(p){if(p.ronda>rondaMax)rondaMax=p.ronda;});
      var rondas=[];
      for(var r=1;r<=rondaMax;r++){
        var enRonda=partidosDelTorneo.filter(function(p){return p.ronda===r;}).sort(function(a,b){return a.posicion-b.posicion;});
        rondas.push(enRonda.map(function(p){
          return {
            j1:p.jugador1_id?idANombre[p.jugador1_id]:null,
            j2:p.jugador2_id?idANombre[p.jugador2_id]:null,
            ganador:p.ganador_id?idANombre[p.ganador_id]:null,
            score:[p.set1,p.set2,p.set3].filter(Boolean).join(' ')||(p.tipo==='W.O.'?'W.O.':null),
            bye:!!p.es_bye,
            mejorPerdedor:!!p.es_mejor_perdedor,
            final:(r===rondaMax)
          };
        }));
      }
      var campeon=null;
      if(rondaMax>0){
        var finalPartido=partidosDelTorneo.filter(function(p){return p.ronda===rondaMax;})[0];
        if(finalPartido&&finalPartido.ganador_id)campeon=idANombre[finalPartido.ganador_id];
      }
      torneosNuevos[key]={id:t.id,serie:t.serie,periodo:t.periodo,temporada:t.temporada,estado:t.estado,campeon:campeon,rondas:rondas};
    });

    if(Object.keys(torneosNuevos).length){
      MOCK_TORNEOS=torneosNuevos; // reemplaza los datos de ejemplo por los reales
      tintActual=Object.keys(MOCK_TORNEOS)[0];
    }
    rTorneoInterno();
  }catch(err){
    console.warn('Sin conexion a Supabase, se muestran datos de ejemplo.',err);
    mostrarErrorClub('Sin conexion. Mostrando el ultimo dato disponible.');
  }
}

    id:"demo-a", serie:"A", periodo:"Apertura", temporada:2026, estado:"finalizado",

var tintActual="A-Apertura";
var realtimeConectado=false; // true una vez que el canal de Supabase confirma la suscripcion

function tintKeys(){return Object.keys(MOCK_TORNEOS);}

function rTintTabs(){
  var el=document.getElementById("tintTabs");
  var h="";
  tintKeys().forEach(function(k){
    var t=MOCK_TORNEOS[k];
    h+="<button class=\"tint-tb"+(k===tintActual?" active":"")+"\" onclick=\"tintCambiar('"+k+"')\">Serie "+esc(t.serie)+" · "+esc(t.periodo)+"</button>";
  });
  el.innerHTML=h;
}
function tintCambiar(k){tintActual=k;rTorneoInterno();}

function rTintEstadoYCampeon(t){
  var estados={armado:"Cuadro armado, sin iniciar",en_curso:"En curso",finalizado:"Finalizado",cancelado:"Cancelado"};
  var liveBadge=realtimeConectado?"<span class=\"tint-live\"><span class=\"tint-live-dot\"></span>EN VIVO</span>":"";
  document.getElementById("tintEstado").innerHTML="Temporada "+t.temporada+" · <b>"+(estados[t.estado]||t.estado)+"</b>"+liveBadge;
  var camp=document.getElementById("tintCampeon");
  if(t.campeon){
    camp.innerHTML="<div class=\"tint-campeon\"><div class=\"ic\">🏆</div><div class=\"lbl\">Campeón "+esc(t.periodo)+" — Serie "+esc(t.serie)+"</div><div class=\"nom\">"+esc(t.campeon)+"</div></div>";
  }else{
    camp.innerHTML="";
  }
}

function tintSlotHtml(nombre,esGanador,score,tbd){
  if(tbd)return "<div class=\"tint-slot tbd\"><span class=\"nm\">Por definir</span></div>";
  return "<div class=\"tint-slot"+(esGanador?" win":"")+"\"><span class=\"nm\">"+esc(nombre)+"</span>"+(score?"<span class=\"sc\">"+esc(score)+"</span>":"")+"</div>";
}

function rTintBracket(t){
  var nombresRonda=["Primera ronda","Segunda ronda","Tercera ronda","Semifinal","Final"];
  // Para cuadros chicos, la "última" ronda siempre se etiqueta Final
  var totalRondas=t.rondas.length;
  var h="";
  t.rondas.forEach(function(matches,ri){
    var esFinal=(ri===totalRondas-1);
    var titulo=esFinal?"Final":(nombresRonda[ri]||("Ronda "+(ri+1)));
    h+="<div class=\"tint-ronda\"><div class=\"tint-rondatit\">"+titulo+"</div>";
    matches.forEach(function(m){
      if(m.bye){
        h+="<div class=\"tint-match\">"+tintSlotHtml(m.j1,true,null,false)+"<div class=\"tint-bye\">Bye — pasa directo</div></div>";
        return;
      }
      var cls="tint-match"+(esFinal?" final":"");
      h+="<div class=\""+cls+"\">";
      if(m.mejorPerdedor)h+="<span class=\"tint-mp\">Mejor perdedor</span>";
      h+=tintSlotHtml(m.j1,m.ganador&&m.ganador===m.j1,m.ganador?m.score:null,!m.j1);
      h+=tintSlotHtml(m.j2,m.ganador&&m.ganador===m.j2,m.ganador?m.score:null,!m.j2);
      h+="</div>";
    });
    h+="</div>";
  });
  document.getElementById("tintBracket").innerHTML=h;
}

function rTorneoInterno(){
  var t=MOCK_TORNEOS[tintActual];
  rTintTabs();
  rTintEstadoYCampeon(t);
  rTintBracket(t);
}

/* ============================================================
   REALTIME: el bracket se actualiza solo, sin refrescar la pagina
   ============================================================
   Confirmado en el dashboard de Supabase (Database > Publications)
   que "torneo_partidos" y "torneos_internos" ya estan agregadas a la
   publicacion supabase_realtime. Esto escucha cualquier INSERT/UPDATE/
   DELETE en esas dos tablas y vuelve a pedir los datos, asi que cuando
   el admin carga un resultado en admin-torneo.html, todos los que
   esten viendo este bracket lo ven cambiar solo, sin apretar F5.

   Con debounce: si llegan varios cambios muy seguidos (ej. se crean
   de una vez todos los partidos de una ronda nueva), se espera medio
   segundo desde el ultimo cambio antes de refrescar, en vez de pedir
   los datos una vez por cada fila tocada.
   ============================================================ */
var _realtimeRefrescoTimer=null;
function _realtimeSolicitarRefresco(){
  if(_realtimeRefrescoTimer)clearTimeout(_realtimeRefrescoTimer);
  _realtimeRefrescoTimer=setTimeout(function(){
    cargarTorneosInternos();
  },500);
}

function iniciarRealtimeTorneoInterno(){
  if(!window.supabaseClient)return;
  try{
    window.supabaseClient
      .channel('torneo-interno-live')
      .on('postgres_changes',{event:'*',schema:'public',table:'torneo_partidos'},_realtimeSolicitarRefresco)
      .on('postgres_changes',{event:'*',schema:'public',table:'torneos_internos'},_realtimeSolicitarRefresco)
      .subscribe(function(status){
        var conectadoAhora=(status==='SUBSCRIBED');
        if(conectadoAhora!==realtimeConectado){
          realtimeConectado=conectadoAhora;
          // repinta el badge "EN VIVO" sin volver a pedir datos a Supabase
          var t=MOCK_TORNEOS[tintActual];
          if(t)rTintEstadoYCampeon(t);
        }
        if(status==='CHANNEL_ERROR'||status==='TIMED_OUT'){
          console.warn('Realtime del Torneo Interno no se pudo conectar (status: '+status+'). El bracket sigue funcionando, solo que sin auto-actualizacion.');
        }
      });
  }catch(err){
    console.warn('No se pudo iniciar Realtime para el Torneo Interno.',err);
  }
}

rTorneoInterno();      // pinta el demo con MOCK_TORNEOS de inmediato (sin esperar red)
cargarTorneosInternos(); // y en cuanto responda Supabase, reemplaza por datos reales
iniciarRealtimeTorneoInterno(); // y desde aca en adelante, se actualiza solo
</script>
