# Genera la pagina de entrada de cada club (para compartir con vista previa en
# WhatsApp/redes) y publica los archivos <slug>.html y manifest-<slug>.json.
# Corre cada 30 minutos (recoge clubes nuevos), al cambiar index.html y a mano
# desde la pestaña Actions > "Paginas de club" > Run workflow.
name: Paginas de club

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'
  push:
    paths:
      - index.html
      - manifest.json
      - generar-paginas-club.js

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generar paginas
        run: node generar-paginas-club.js
      - name: Guardar cambios
        run: |
          git config user.name "paginas-club"
          git config user.email "paginas-club@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Actualiza paginas de club" && git push)
