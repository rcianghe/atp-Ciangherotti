<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Admin — Torneo Interno CTQ</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;600;700&family=Barlow+Condensed:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--v:#5BBF2A;--vd:#3d8a1a;--am:#D4E60A;--az:#2E7DD1;--ro:#C0392B;--ng:#0e0e0e;--gd:#1a1a1a;--g:#2a2a2a;--gm:#3a3a3a;--gl:#888;--bl:#f5f5f0}
*{box-sizing:border-box}
body{margin:0;font-family:'Barlow',Arial,sans-serif;background:var(--ng);color:var(--bl);padding:1.2rem 1rem 4rem;max-width:760px;margin:0 auto}
h1{font-family:'Bebas Neue',sans-serif;font-size:1.7rem;letter-spacing:2px;color:var(--v);margin:0 0 .2rem}
.sub{color:var(--gl);font-size:.8rem;margin-bottom:1.4rem}
.card{background:var(--gd);border:1px solid var(--gm);border-radius:10px;padding:1rem 1.1rem;margin-bottom:1rem}
.btn{font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:1px;text-transform:uppercase;font-size:.72rem;padding:.5rem .9rem;border:none;border-radius:5px;cursor:pointer}
.btn.v{background:var(--v);color:var(--ng)}
.btn.az{background:var(--az);color:#fff}
.btn.ro{background:transparent;color:#e05a4a;border:1px solid rgba(192,57,43,.5)}
.btn.gl{background:transparent;color:var(--gl);border:1px solid var(--gm)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
input[type=text],input[type=number],select{background:var(--g);border:1px solid var(--gm);border-radius:5px;padding:.5rem .6rem;color:var(--bl);font-family:'Barlow',sans-serif;font-size:.85rem}
.tabs{display:flex;gap:.4rem;margin-bottom:1rem}
.tb{font-family:'Barlow Condensed',sans-serif;font-size:.78rem;font-weight:700;letter-spacing:1px;padding:.4rem 1rem;background:var(--g);color:var(--gl);border:1px solid var(--gm);border-radius:5px;cursor:pointer}
.tb.active{background:var(--v);color:var(--ng);border-color:var(--v)}
.torneo-item{display:flex;justify-content:space-between;align-items:center;padding:.6rem 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:.85rem}
.torneo-item:last-child{border-bottom:none}
.estado-pill{font-size:.62rem;text-transform:uppercase;letter-spacing:1px;padding:.15rem .5rem;border-radius:10px;background:var(--gm);color:var(--gl)}
.estado-pill.armado{background:rgba(46,125,209,.2);color:#7ab5e8}
.estado-pill.en_curso{background:rgba(212,230,10,.2);color:var(--am)}
.estado-pill.finalizado{background:rgba(91,191,42,.2);color:var(--v)}
.seedlist{display:flex;flex-direction:column;gap:.35rem;margin:.7rem 0}
.seedrow{display:flex;align-items:center;gap:.5rem;background:var(--g);border-radius:6px;padding:.4rem .6rem;font-size:.85rem}
.seedrow .num{font-family:'Bebas Neue',sans-serif;color:var(--v);width:22px}
.seedrow .nm{flex:1}
.seedrow.excluido{opacity:.4}
.seedrow .pts{font-size:.68rem;color:var(--gl)}
.iconbtn{background:var(--gm);border:none;color:var(--bl);width:24px;height:24px;border-radius:4px;cursor:pointer;font-size:.8rem}
.iconbtn:hover{background:var(--v);color:var(--ng)}
.ronda-tit{font-family:'Barlow Condensed',sans-serif;font-size:.68rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--v);margin:1.1rem 0 .5rem}
.match{background:var(--g);border:1px solid rgba(255,255,255,.07);border-radius:8px;padding:.7rem .8rem;margin-bottom:.6rem}
.match.final{border-color:rgba(212,230,10,.5)}
.mplayers{display:flex;justify-content:space-between;font-size:.86rem;margin-bottom:.4rem}
.mplayers .win{color:var(--v);font-weight:700}
.mp-badge{font-size:.6rem;background:var(--az);color:#fff;padding:.1rem .4rem;border-radius:8px;margin-left:.3rem}
.bye-tag{font-size:.7rem;color:var(--gl);font-style:italic}
.resform{display:flex;gap:.35rem;flex-wrap:wrap;align-items:center;margin-top:.4rem}
.resform input[type=text]{width:70px}
.jugado{font-size:.78rem;color:var(--gl)}
.msg{font-size:.8rem;padding:.6rem .8rem;border-radius:6px;margin-bottom:1rem}
.msg.err{background:rgba(192,57,43,.15);color:#ff8a7a;border:1px solid rgba(192,57,43,.4)}
.msg.ok{background:rgba(91,191,42,.15);color:var(--v);border:1px solid rgba(91,191,42,.4)}
.backbtn{background:none;border:none;color:var(--gl);font-size:.78rem;cursor:pointer;margin-bottom:.8rem;padding:0}
.backbtn:hover{color:var(--v)}
.mp-picker{margin-top:.8rem;padding-top:.8rem;border-top:1px dashed var(--gm)}
.mp-opt{display:flex;align-items:center;gap:.5rem;font-size:.82rem;padding:.35rem 0}
.clubsel{background:var(--g);border:1px solid var(--gm);border-radius:5px;padding:.5rem .6rem;color:var(--bl);font-family:'Barlow',sans-serif;font-size:.85rem}
.clubpill{font-family:'Barlow Condensed',sans-serif;font-size:.68rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:.2rem .6rem;border-radius:10px;background:rgba(91,191,42,.18);color:var(--v);border:1px solid rgba(91,191,42,.4)}
</style>
</head>
<body>

<h1>Torneo Interno — Panel Admin</h1>
<div class="sub" id="subHeader">Club de Tenis Estadio Quilicura</div>

<div id="app"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="lib/supabase.min.js/supabase.min.js"></script>
<script>
var SUPABASE_URL = 'https://hjqzpxsqdbjcidmlvgkv.supabase.co';
var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhqcXpweHNxZGJqY2lkbWx2Z2t2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxMjU0NzIsImV4cCI6MjEwMTcwMTQ3Mn0.MNPwvAMtxFTWr-7ONIevrFDe7hC2Bd7z-dsm9H8zWIo';
window.supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");}
function jsAttr(s){return esc(String(s==null?"":s).replace(/\\/g,"\\\\").replace(/'/g,"\\'"));}

var PUNTOS={gana2sets:300,gana3sets:200,pierde3sets:50,pierde2sets:25,ganaWO:300,pierdeWO:0};

var usuarioActual=null, esAdmin=false, chequeoListo=false;
var serieActual='A';
var jugadoresClub=[]; // [{id,nombre,serie,estado}]
var torneosSerie=[];
var torneoAbierto=null; // fila de torneos_internos
var partidos=[]; // filas de torneo_partidos del torneo abierto
var seedList=[]; // [{id,nombre,pts,incluido}] solo mientras no hay ronda 1 creada
var mensaje=null; // {tipo:'ok'|'err', texto}
var mpSeleccion=null; // jugador_id elegido como "mejor perdedor" al avanzar de ronda
var guardando=false;

// ---- Fase 3: club administrado en esta sesion ----
// Si el admin logueado tiene admins.club_id definido (admin scoped),
// clubActual queda fijo a ese club y no se muestra selector.
// Si admins.club_id es NULL (super-admin, ej. Ricardo), se carga la
// lista de clubes activos y se muestra un selector: hay que elegir
// explicitamente cual club administrar antes de ver nada.
var adminClubIdFijo=null;   // club_id de la fila admins de este usuario (null = super-admin)
var clubesDisponibles=[];   // [{id,nombre,slug}] solo se llena para super-admin
var clubActual=null;        // club_id efectivamente seleccionado/fijo para esta sesion
var clubActualNombre='';

// ---- Visibilidad publica del Torneo Interno (interruptor activo/inactivo) ----
// Controla si la seccion "Interno" aparece en el menu y la pagina publica
// (index.html). Vive en la tabla "configuracion_sitio" (clave/valor), asi
// que el interruptor es global y persiste para todos los visitantes.
var torneoInternoVisible=true; // por defecto visible, hasta que se confirme lo contrario
var visibilidadCargando=false;
var visibilidadTablaDisponible=true; // false si "configuracion_sitio" aun no existe (falta correr la migracion)

// ---- Fase 4: Torneos de plataforma (ChileTenis Pro, Nivel 2) ----
// A diferencia del Torneo Interno (siempre de UN club), estos torneos
// tienen competiciones.club_id = null y organizacion_id apuntando a
// ChileTenis Pro. Cualquier jugador de cualquier club puede participar.
// Solo un admin universal (adminClubIdFijo === null) puede administrarlos.
var vistaPlataforma=false;      // true = viendo/administrando torneos de plataforma en vez de los del club
var jugadoresTodos=[];          // jugadores de TODOS los clubes (para el seeding cross-club)
var jugadoresTodosCargados=false;
var torneosPlataforma=[];       // listado de competiciones tipo=plataforma
// torneoAbierto / partidos / seedList / mpSeleccion se REUSAN tal cual
// para torneos de plataforma: toda la maquinaria de bracket (generar
// Ronda 1, avanzar ronda, registrar/deshacer resultado) es identica sin
// importar si el torneo tiene club_id o no, asi que no hace falta
// duplicarla.

// Codigos de error de PostgREST para "no existe la tabla"/"no existe la
// columna" (42P01 / 42703): asi distinguimos "falta correr la migracion"
// de un fallo de red real.
function esErrorEsquemaFaltante(err){
  return !!err&&(err.code==='42P01'||err.code==='42703');
}

async function cargarVisibilidadTorneoInterno(){
  if(!clubActual)return;
  try{
    var res=await window.supabaseClient.from('configuracion_sitio').select('valor').eq('clave','torneo_interno_visible').eq('club_id',clubActual).maybeSingle();
    if(res.error){
      if(esErrorEsquemaFaltante(res.error)){
        console.warn('La tabla "configuracion_sitio" todavia no existe. Corre la migracion en Supabase.',res.error);
        visibilidadTablaDisponible=false;
      }
      return;
    }
    visibilidadTablaDisponible=true;
    torneoInternoVisible=res.data?(res.data.valor!==false):true;
  }catch(err){
    console.warn('Sin conexion al cargar la visibilidad del Torneo Interno.',err);
  }
}

async function toggleVisibilidadTorneoInterno(){
  if(visibilidadCargando||!visibilidadTablaDisponible||!clubActual)return;
  var nuevo=!torneoInternoVisible;
  visibilidadCargando=true;render();
  try{
    var res=await window.supabaseClient.from('configuracion_sitio').upsert({clave:'torneo_interno_visible',club_id:clubActual,valor:nuevo},{onConflict:'clave,club_id'});
    if(res.error){
      visibilidadCargando=false;
      setMsg('err','No se pudo cambiar la visibilidad: '+res.error.message);
      return;
    }
    torneoInternoVisible=nuevo;
    visibilidadCargando=false;
    setMsg('ok',nuevo?'Torneo Interno ACTIVADO: ya aparece en el menu del sitio.':'Torneo Interno DESACTIVADO: se oculto del menu y la pagina del sitio.');
  }catch(err){
    console.warn('Sin conexion al cambiar la visibilidad.',err);
    visibilidadCargando=false;
    setMsg('err','Sin conexion. Intenta de nuevo.');
  }
}

function setMsg(tipo,texto){mensaje={tipo:tipo,texto:texto};render();}

function loginConGoogle(){
  var redirectLimpio=window.location.origin+window.location.pathname;
  window.supabaseClient.auth.signInWithOAuth({provider:'google',options:{redirectTo:redirectLimpio}});
}
function logout(){window.supabaseClient.auth.signOut();}

window.supabaseClient.auth.getSession().then(function(r){
  var session=r.data&&r.data.session;
  usuarioActual=session?{uid:session.user.id,nombre:session.user.user_metadata.full_name,email:session.user.email}:null;
  chequearAdmin();
});
window.supabaseClient.auth.onAuthStateChange(function(event,session){
  usuarioActual=session?{uid:session.user.id,nombre:session.user.user_metadata.full_name,email:session.user.email}:null;
  chequearAdmin();
});

async function chequearAdmin(){
  chequeoListo=false;render();
  if(!usuarioActual){esAdmin=false;chequeoListo=true;render();return;}
  try{
    var res=await window.supabaseClient.from('admins').select('user_id,club_id').eq('user_id',usuarioActual.uid).maybeSingle();
    esAdmin=!res.error&&!!res.data;
    adminClubIdFijo=esAdmin?(res.data.club_id||null):null;
  }catch(e){esAdmin=false;adminClubIdFijo=null;}
  chequeoListo=true;
  if(esAdmin){
    if(adminClubIdFijo){
      // Admin scoped a un solo club: no hay nada que elegir.
      await fijarClubActual(adminClubIdFijo);
    }else{
      // Super-admin (club_id NULL): hay que elegir explicitamente cual
      // club administrar antes de cargar cualquier dato.
      await cargarClubesDisponibles();
    }
  }
  render();
}

async function cargarClubesDisponibles(){
  try{
    var res=await window.supabaseClient.from('clubes').select('id,nombre,slug').eq('activo',true).order('nombre');
    clubesDisponibles=res.error?[]:res.data;
  }catch(e){clubesDisponibles=[];}
}

// Fija clubActual (ya sea porque el admin es scoped, o porque el
// super-admin lo eligio en el selector) y recarga todos los datos
// dependientes de club desde cero.
async function fijarClubActual(clubId){
  clubActual=clubId;
  var c=clubesDisponibles.filter(function(x){return x.id===clubId;})[0];
  clubActualNombre=c?c.nombre:'';
  if(!clubActualNombre){
    try{
      var res=await window.supabaseClient.from('clubes').select('nombre').eq('id',clubId).maybeSingle();
      clubActualNombre=(!res.error&&res.data)?res.data.nombre:'';
    }catch(e){}
  }
  var sub=document.getElementById('subHeader');
  if(sub)sub.textContent=clubActualNombre||'Club de Tenis Estadio Quilicura';
  torneoAbierto=null;partidos=[];mensaje=null;
  await cargarJugadoresClub();
  await cargarTorneosDeSerie(serieActual);
  await cargarVisibilidadTorneoInterno();
  render();
}

function seleccionarClubAdmin(clubId){
  if(!clubId)return;
  fijarClubActual(clubId);
}

async function cargarJugadoresClub(){
  if(!clubActual){jugadoresClub=[];return;}
  var res=await window.supabaseClient.from('jugadores').select('id,nombre,serie,estado').eq('club_id',clubActual);
  jugadoresClub=res.error?[]:res.data;
}

async function cargarTorneosDeSerie(serie){
  if(!clubActual){torneosSerie=[];return;}
  var res=await window.supabaseClient.from('competiciones').select('*').eq('tipo','interno').eq('serie',serie).eq('club_id',clubActual).order('temporada',{ascending:false});
  torneosSerie=res.error?[]:res.data;
}

function seleccionarSerie(s){
  serieActual=s;torneoAbierto=null;partidos=[];mensaje=null;
  cargarTorneosDeSerie(s).then(render);
  render();
}

// ---- Puntos base de la Escalerilla (solo para sugerir el orden de siembra) ----
async function calcularPuntosBaseSerie(serie){
  var res=await window.supabaseClient.from('resultados')
    .select('jugador1_id,jugador2_id,ganador_id,set1,set2,set3,tipo,serie,torneo_partido_id')
    .eq('serie',serie).eq('club_id',clubActual).is('torneo_partido_id',null); // solo partidos de la escalerilla, no de un interno anterior
  var pts={};
  if(!res.error){
    res.data.forEach(function(r){
      [r.jugador1_id,r.jugador2_id].forEach(function(id){
        if(!id)return;
        var gane=r.ganador_id===id;
        var esWO=r.tipo==='W.O.';
        var sets=esWO?0:[r.set1,r.set2,r.set3].filter(Boolean).length;
        var p=gane?(esWO?PUNTOS.ganaWO:(sets===2?PUNTOS.gana2sets:PUNTOS.gana3sets))
                  :(esWO?PUNTOS.pierdeWO:(sets===2?PUNTOS.pierde2sets:PUNTOS.pierde3sets));
        pts[id]=(pts[id]||0)+p;
      });
    });
  }
  return pts;
}

// Resuelve la temporada activa del club actual (para crear torneos
// internos sin depender de un id fijo). Si no hay ninguna temporada
// marcada activa=true para este club, devuelve null y crearTorneo()
// avisa en vez de insertar con un valor invalido.
async function obtenerTemporadaActivaDelClub(){
  if(!clubActual)return null;
  try{
    var res=await window.supabaseClient.from('temporadas').select('id').eq('club_id',clubActual).eq('activa',true).limit(1).maybeSingle();
    return (!res.error&&res.data)?res.data.id:null;
  }catch(e){return null;}
}

async function crearTorneo(){
  if(!clubActual){setMsg('err','Selecciona primero el club a administrar.');return;}
  var temporada=parseInt(document.getElementById('inTemporada').value,10);
  var periodo=(document.getElementById('inPeriodo').value||'').trim()||null;
  if(!temporada){setMsg('err','Ingresa la temporada (año).');return;}
  guardando=true;render();
  var temporadaId=await obtenerTemporadaActivaDelClub();
  if(!temporadaId){
    guardando=false;
    setMsg('err','No se encontro una temporada activa para este club. Crea/activa una temporada primero.');
    return;
  }
  var res=await window.supabaseClient.from('competiciones').insert({
    tipo:'interno',serie:serieActual,temporada:temporada,periodo:periodo,
    club_id:clubActual,
    temporada_id:temporadaId
  }).select().maybeSingle();
  guardando=false;
  if(res.error){setMsg('err','No se pudo crear el torneo: '+res.error.message);return;}
  await cargarTorneosDeSerie(serieActual);
  abrirTorneo(res.data);
}

// ============================================================
// FASE 4: TORNEOS DE PLATAFORMA (ChileTenis Pro, Nivel 2)
// ============================================================
// Entra/sale del modo "ChileTenis Pro": solo disponible para admins
// universales (adminClubIdFijo === null). No toca clubActual ni nada
// de lo que ya esta cargado del club -- al volver, el modo club sigue
// exactamente donde estaba.
async function entrarModoPlataforma(){
  if(adminClubIdFijo)return; // resguardo: solo super-admin
  vistaPlataforma=true;torneoAbierto=null;partidos=[];mensaje=null;
  render();
  if(!jugadoresTodosCargados)await cargarJugadoresTodos();
  await cargarTorneosPlataforma();
  render();
}
function volverModoClub(){
  vistaPlataforma=false;torneoAbierto=null;partidos=[];mensaje=null;render();
}

async function cargarJugadoresTodos(){
  var res=await window.supabaseClient.from('jugadores').select('id,nombre,serie,estado,club_id,clubes(nombre)');
  jugadoresTodos=res.error?[]:res.data.map(function(j){
    return {id:j.id,nombre:j.nombre,serie:j.serie,estado:j.estado,club_id:j.club_id,clubNombre:(j.clubes&&j.clubes.nombre)||''};
  });
  jugadoresTodosCargados=true;
}

async function cargarTorneosPlataforma(){
  var res=await window.supabaseClient.from('competiciones').select('*').eq('tipo','plataforma').is('club_id',null).order('temporada',{ascending:false});
  torneosPlataforma=res.error?[]:res.data;
}

function abrirTorneoPlataformaIdx(idx){abrirTorneo(torneosPlataforma[idx]);}

async function crearTorneoPlataforma(){
  var temporada=parseInt(document.getElementById('inTemporadaPlataforma').value,10);
  var nombreTorneo=(document.getElementById('inNombrePlataforma').value||'').trim()||null;
  if(!temporada){setMsg('err','Ingresa la temporada (año).');return;}
  guardando=true;render();
  // club_id y serie quedan null a proposito (torneo de plataforma, sin
  // club dueno ni series por serie de escalerilla). organizacion_id se
  // completa solo via el DEFAULT de la base (fn_organizacion_plataforma_default).
  var res=await window.supabaseClient.from('competiciones').insert({
    tipo:'plataforma',temporada:temporada,periodo:nombreTorneo,
    club_id:null,serie:null
  }).select().maybeSingle();
  guardando=false;
  if(res.error){setMsg('err','No se pudo crear el torneo: '+res.error.message);return;}
  await cargarTorneosPlataforma();
  abrirTorneo(res.data);
}

// Seeding cross-club: a diferencia del Torneo Interno (ordenado por
// puntos de la escalerilla del club), aca no hay un puntaje comun entre
// clubes distintos todavia -- se lista alfabeticamente y el admin
// reordena a mano con las mismas flechas que ya existen en renderSeeding().
async function prepararSeedingPlataforma(){
  if(!jugadoresTodosCargados)await cargarJugadoresTodos();
  var activos=jugadoresTodos.filter(function(j){return j.estado!=='Retirado -50%';});
  activos.sort(function(a,b){return a.nombre.localeCompare(b.nombre);});
  seedList=activos.map(function(j){return {id:j.id,nombre:j.nombre,pts:0,club:j.clubNombre,incluido:true};});
}

function abrirTorneoIdx(idx){abrirTorneo(torneosSerie[idx]);}
async function abrirTorneo(t){
  torneoAbierto=t;mensaje=null;mpSeleccion=null;
  await cargarPartidos(t.id);
  if(!partidos.length)await prepararSeeding();
  render();
}
function volverListado(){torneoAbierto=null;partidos=[];mensaje=null;render();}

async function cargarPartidos(torneoId){
  var res=await window.supabaseClient.from('torneo_partidos').select('*').eq('torneo_id',torneoId).order('ronda').order('posicion');
  partidos=res.error?[]:res.data;
}

async function prepararSeeding(){
  if(torneoAbierto&&torneoAbierto.club_id==null){await prepararSeedingPlataforma();return;}
  var pts=await calcularPuntosBaseSerie(serieActual);
  var jugadoresSerie=jugadoresClub.filter(function(j){return j.serie===serieActual&&j.estado!=='Retirado -50%';});
  jugadoresSerie.sort(function(a,b){return (pts[b.id]||0)-(pts[a.id]||0);});
  seedList=jugadoresSerie.map(function(j){return {id:j.id,nombre:j.nombre,pts:pts[j.id]||0,incluido:true};});
}

function nombreDe(id){
  var j=jugadoresClub.filter(function(x){return x.id===id;})[0]
    ||jugadoresTodos.filter(function(x){return x.id===id;})[0];
  return j?j.nombre:'?';
}

function moverSeed(idx,delta){
  var j=idx+delta;
  if(j<0||j>=seedList.length)return;
  var tmp=seedList[idx];seedList[idx]=seedList[j];seedList[j]=tmp;
  render();
}
function toggleSeedIncluido(idx){seedList[idx].incluido=!seedList[idx].incluido;render();}

// ---- Generar Ronda 1 segun el reglamento: sembrados 1 y 2 con bye,
// el resto emparejado mas alto vs mas bajo. ----
async function generarRonda1(){
  var incluidos=seedList.filter(function(s){return s.incluido;});
  if(incluidos.length<4){setMsg('err','Necesitas al menos 4 jugadores incluidos para armar un cuadro.');return;}
  var byes=incluidos.slice(0,2);
  var resto=incluidos.slice(2);
  var filas=[];
  var pos=0;
  byes.forEach(function(s){
    filas.push({torneo_id:torneoAbierto.id,ronda:1,posicion:pos++,jugador1_id:s.id,jugador2_id:null,ganador_id:s.id,es_bye:true});
  });
  var i=0,j=resto.length-1;
  while(i<j){
    filas.push({torneo_id:torneoAbierto.id,ronda:1,posicion:pos++,jugador1_id:resto[i].id,jugador2_id:resto[j].id,es_bye:false});
    i++;j--;
  }
  if(i===j){ // cantidad impar de "resto": el ultimo tambien pasa con bye
    filas.push({torneo_id:torneoAbierto.id,ronda:1,posicion:pos++,jugador1_id:resto[i].id,jugador2_id:null,ganador_id:resto[i].id,es_bye:true});
  }
  guardando=true;render();
  var res=await window.supabaseClient.from('torneo_partidos').insert(filas);
  if(!res.error)await window.supabaseClient.from('competiciones').update({estado:'en_curso'}).eq('id',torneoAbierto.id);
  guardando=false;
  if(res.error){setMsg('err','No se pudo crear la Ronda 1: '+res.error.message);return;}
  await cargarPartidos(torneoAbierto.id);
  torneoAbierto.estado='en_curso';
  setMsg('ok','Ronda 1 creada.');
}

function rondaMaxima(){var m=0;partidos.forEach(function(p){if(p.ronda>m)m=p.ronda;});return m;}
function partidosDeRonda(r){return partidos.filter(function(p){return p.ronda===r;}).sort(function(a,b){return a.posicion-b.posicion;});}
function rondaCompleta(r){return partidosDeRonda(r).every(function(p){return !!p.ganador_id;});}

async function guardarResultado(partidoId,jugador1Id,jugador2Id){
  var s1=document.getElementById('s1-'+partidoId).value.trim();
  var s2=document.getElementById('s2-'+partidoId).value.trim();
  var s3=document.getElementById('s3-'+partidoId).value.trim();
  var wo=document.getElementById('wo-'+partidoId).checked;
  var ganadorSel=document.getElementById('gan-'+partidoId).value;
  if(!ganadorSel){setMsg('err','Selecciona quien gano el partido.');return;}
  if(!wo&&!s1){setMsg('err','Ingresa al menos el primer set, o marca W.O.');return;}
  guardando=true;render();
  var res=await window.supabaseClient.rpc('registrar_resultado_partido',{
    p_partido_id:partidoId,p_ganador_id:ganadorSel,
    p_set1:wo?null:(s1||null),p_set2:wo?null:(s2||null),p_set3:wo?null:(s3||null),
    p_tipo:wo?'W.O.':'normal'
  });
  guardando=false;
  if(res.error){setMsg('err','No se pudo guardar el resultado: '+res.error.message);return;}
  await cargarPartidos(torneoAbierto.id);
  var tRes=await window.supabaseClient.from('competiciones').select('*').eq('id',torneoAbierto.id).maybeSingle();
  if(!tRes.error&&tRes.data)torneoAbierto=tRes.data;
  setMsg('ok','Resultado guardado.');
}

async function deshacerResultado(partidoId){
  if(!confirm('¿Deshacer este resultado? El partido queda sin marcador otra vez.'))return;
  guardando=true;render();
  var res=await window.supabaseClient.rpc('deshacer_resultado_partido',{p_partido_id:partidoId});
  guardando=false;
  if(res.error){setMsg('err','No se pudo deshacer: '+res.error.message);return;}
  await cargarPartidos(torneoAbierto.id);
  setMsg('ok','Resultado deshecho.');
}

async function reiniciarCuadro(){
  if(!confirm('Esto borra TODO el cuadro (todas las rondas y resultados) de este torneo y vuelve a "armado". ¿Confirmas?'))return;
  guardando=true;render();
  var res=await window.supabaseClient.rpc('reset_torneo_interno',{p_torneo_id:torneoAbierto.id});
  guardando=false;
  if(res.error){setMsg('err','No se pudo reiniciar: '+res.error.message);return;}
  torneoAbierto.estado='armado';
  await cargarPartidos(torneoAbierto.id);
  await prepararSeeding();
  setMsg('ok','Cuadro reiniciado. Puedes volver a armarlo.');
}

async function eliminarTorneo(){
  if(!confirm('Esto elimina el torneo COMPLETO (no solo el cuadro). ¿Confirmas?'))return;
  guardando=true;render();
  var res=await window.supabaseClient.rpc('eliminar_torneo_interno',{p_torneo_id:torneoAbierto.id});
  guardando=false;
  if(res.error){setMsg('err','No se pudo eliminar: '+res.error.message);return;}
  if(vistaPlataforma)await cargarTorneosPlataforma();else await cargarTorneosDeSerie(serieActual);
  volverListado();
}

// ---- Avanzar de ronda ----
function ganadoresDeRonda(r){return partidosDeRonda(r).map(function(p){return p.ganador_id;}).filter(Boolean);}
function perdedoresRealesDeRonda(r){ // excluye byes, que no tienen "perdedor"
  return partidosDeRonda(r).filter(function(p){return !p.es_bye&&p.ganador_id;}).map(function(p){
    var perdedorId=p.ganador_id===p.jugador1_id?p.jugador2_id:p.jugador1_id;
    var score=[p.set1,p.set2,p.set3].filter(Boolean).join(' ')||(p.tipo==='W.O.'?'W.O.':'');
    return {id:perdedorId,score:score,rivalGanador:p.ganador_id};
  });
}

async function avanzarRonda(){
  var r=rondaMaxima();
  var ganadores=ganadoresDeRonda(r);
  if(ganadores.length===1){setMsg('err','Ya no hay mas rondas: el campeon ya deberia estar definido.');return;}
  var listaAvance=ganadores.slice();
  if(listaAvance.length%2!==0){
    if(!mpSeleccion){setMsg('err','Cantidad impar de ganadores: selecciona abajo el "mejor perdedor" que avanza junto con ellos.');return;}
    listaAvance.push(mpSeleccion);
  }
  var filas=[];
  var pos=0;
  for(var i=0;i<listaAvance.length;i+=2){
    var esMP=(listaAvance[i]===mpSeleccion||listaAvance[i+1]===mpSeleccion);
    filas.push({torneo_id:torneoAbierto.id,ronda:r+1,posicion:pos++,jugador1_id:listaAvance[i],jugador2_id:listaAvance[i+1],es_bye:false,es_mejor_perdedor:esMP});
  }
  guardando=true;render();
  var res=await window.supabaseClient.from('torneo_partidos').insert(filas);
  guardando=false;
  if(res.error){setMsg('err','No se pudo crear la siguiente ronda: '+res.error.message);return;}
  mpSeleccion=null;
  await cargarPartidos(torneoAbierto.id);
  setMsg('ok','Ronda '+(r+1)+' creada.');
}

function render(){
  var el=document.getElementById('app');
  if(!chequeoListo){el.innerHTML='<div class="sub">Cargando...</div>';return;}
  if(!usuarioActual){
    el.innerHTML='<div class="card"><p style="margin-top:0">Inicia sesion con la cuenta de Google que esta en la tabla <code>admins</code>.</p>'
      +'<button class="btn v" onclick="loginConGoogle()">Iniciar sesion con Google</button></div>';
    return;
  }
  if(!esAdmin){
    el.innerHTML='<div class="card"><p style="margin-top:0">La cuenta <b>'+esc(usuarioActual.email||usuarioActual.nombre)+'</b> no esta autorizada como administradora del torneo.</p>'
      +'<button class="btn gl" onclick="logout()">Cerrar sesion</button></div>';
    return;
  }
  var h='<div class="row" style="justify-content:space-between;margin-bottom:1rem">'
    +'<span class="sub" style="margin:0">Conectado como <b style="color:var(--bl)">'+esc(usuarioActual.nombre||usuarioActual.email)+'</b>'
    +(adminClubIdFijo?'':' <span class="clubpill">Super-admin</span>')+'</span>'
    +'<div class="row" style="gap:.5rem">'
    +(!adminClubIdFijo?('<button class="btn '+(vistaPlataforma?'gl':'az')+'" onclick="'+(vistaPlataforma?'volverModoClub()':'entrarModoPlataforma()')+'">'+(vistaPlataforma?'← Volver a mi club':'🌐 ChileTenis Pro')+'</button>'):'')
    +'<button class="btn gl" onclick="logout()">Salir</button></div></div>';

  // Modo plataforma (ChileTenis Pro): se revisa ANTES que el selector de
  // club, porque un super-admin puede entrar aca sin haber elegido
  // ningun club todavia (los torneos de plataforma no dependen de uno).
  if(vistaPlataforma){
    h+=renderPlataformaBanner();
    if(mensaje)h+='<div class="msg '+(mensaje.tipo==='ok'?'ok':'err')+'">'+esc(mensaje.texto)+'</div>';
    h+=torneoAbierto?renderTorneoAbierto():renderSelectorYListadoPlataforma();
    el.innerHTML=h;
    return;
  }

  // Super-admin sin club elegido todavia: mostrar selector y no seguir
  // renderizando nada mas hasta que se elija.
  if(!adminClubIdFijo&&!clubActual){
    h+=renderSelectorClub();
    el.innerHTML=h;
    return;
  }

  h+=renderClubActualBanner();
  h+=renderVisibilidadTorneoInterno();

  if(mensaje){
    h+='<div class="msg '+(mensaje.tipo==='ok'?'ok':'err')+'">'+esc(mensaje.texto)+'</div>';
  }

  if(torneoAbierto){
    h+=renderTorneoAbierto();
  }else{
    h+=renderSelectorYListado();
  }
  el.innerHTML=h;
}

function renderBracketAdmin(){
  var h='';
  var rMax=rondaMaxima();
  for(var r=1;r<=rMax;r++){
    var esUltima=(r===rMax);
    h+='<div class="ronda-tit">'+(esUltima?'Ultima ronda cargada':'Ronda '+r)+'</div>';
    partidosDeRonda(r).forEach(function(p){
      h+=renderMatchAdmin(p,esUltima&&partidosDeRonda(r).length===1);
    });
  }

  if(rondaCompleta(rMax)){
    var ganadores=ganadoresDeRonda(rMax);
    if(ganadores.length===1){
      h+='<div class="card" style="text-align:center;border-color:rgba(212,230,10,.5)"><b style="color:var(--am)">Campeon definido: '+esc(nombreDe(ganadores[0]))+'</b><p class="sub" style="margin-bottom:0">Ya deberia aparecer en el perfil del jugador y en el sitio publico.</p></div>';
    }else{
      h+=renderAvanzarRonda(rMax,ganadores);
    }
  }
  return h;
}

}

function renderAvanzarRonda(rMax,ganadores){
  var h='<div class="card">';
  if(ganadores.length%2===0){
    h+='<p style="margin-top:0">Todos los partidos de esta ronda tienen resultado. Puedes generar la siguiente ronda.</p>'
      +'<button class="btn v" '+(guardando?'disabled':'')+' onclick="avanzarRonda()">Generar Ronda '+(rMax+1)+'</button>';
  }else{
    h+='<p style="margin-top:0"><b>Cantidad impar de ganadores ('+ganadores.length+')</b>: segun el reglamento, hay que sumar al <b>mejor perdedor</b> de esta ronda para poder emparejar la siguiente.</p>';
    var perdedores=perdedoresRealesDeRonda(rMax);
    if(!perdedores.length){
      h+='<p class="sub">No hay perdedores disponibles en esta ronda (revisa si hay demasiados byes). Ajusta manualmente si es necesario.</p>';
    }else{
      h+='<div class="mp-picker">';
      perdedores.forEach(function(pl){
        h+='<label class="mp-opt"><input type="radio" name="mpsel" value="'+esc(pl.id)+'" '+(mpSeleccion===pl.id?'checked':'')+' onchange="mpSeleccion=\''+jsAttr(pl.id)+'\';render()"> '
          +esc(nombreDe(pl.id))+' <span class="sub" style="margin:0">(perdio '+esc(pl.score)+' vs '+esc(nombreDe(pl.rivalGanador))+')</span></label>';
      });
      h+='</div><button class="btn v" style="margin-top:.6rem" '+(guardando||!mpSeleccion?'disabled':'')+' onclick="avanzarRonda()">Generar Ronda '+(rMax+1)+' con mejor perdedor</button>';
    }
  }
  h+='</div>';
  return h;
}

render();
</script>
</body>
</html>
